<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <h1>Habit Tracker</h1>
    <button type="button" id="logout-btn" class="btn-logout">Log Out</button>
  </header>

  <main class="app-main">

    <div class="card form-section">
      <div class="form-section-header">
        <div class="form-section-icon">＋</div>
        <div>
          <p class="section-title">Add Habit</p>
          <p class="section-subtitle">Track a new habit to build consistency</p>
        </div>
      </div>

      <form id="add-habit-form" class="habit-form-grid">
        <div class="form-field">
          <label for="name" class="form-label">Habit Name</label>
          <input type="text" id="name" placeholder="e.g. Morning run, Read 20 mins…" required>
        </div>

        <div class="form-field">
          <label for="category" class="form-label">Category</label>
          <!-- Categories fix: was a hardcoded list of <option>s, now filled by JS from /api/categories -->
          <select id="category" required></select>
        </div>

        <div class="form-field">
          <label for="frequency" class="form-label">Frequency</label>
          <select id="frequency" required>
            <option value="Daily">Daily</option>
            <option value="Weekly">Weekly</option>
            <option value="Monthly">Monthly</option>
          </select>
        </div>

        <div class="form-field form-field--day-of-month" id="day-of-month-field" hidden>
          <label for="day-of-month" class="form-label">Day of Month</label>
          <input type="number" id="day-of-month" placeholder="1 – 31" min="1" max="31">
        </div>

        <div class="form-field form-field--submit">
          <button type="submit" class="btn-add-habit">Add Habit</button>
        </div>
      </form>

      <div class="add-category-row">
        <span class="add-category-label">Add Category</span>
        <form id="add-category-form" class="add-category-form">
          <input type="text" id="category-name" placeholder="Category name" required>
          <button type="submit">Add</button>
        </form>
      </div>
    </div>

    <div class="table-section">
    <div class="toolbar-bar">

      <div class="toolbar-chip-group" id="sort-controls">
        <span class="toolbar-chip-label">Sort by</span>
        <select id="sort-field" class="toolbar-select">
          <option value="name">Name</option>
          <option value="category">Category</option>
          <option value="frequency">Frequency</option>
          <option value="checkins">Check-ins</option>
        </select>
        <select id="sort-dir" class="toolbar-select toolbar-select--dir">
          <option value="asc">↑ Asc</option>
          <option value="desc">↓ Desc</option>
        </select>
      </div>

      <div class="toolbar-sep"></div>

      <div class="toolbar-chip-group" id="filter-controls">
        <span class="toolbar-chip-label">Filter</span>
        <select id="filter-category" class="toolbar-select"></select>
        <div class="date-range">
          <input type="date" id="filter-date-from" class="toolbar-date" title="From date">
          <span class="date-range-arrow">→</span>
          <input type="date" id="filter-date-to" class="toolbar-date" title="To date">
        </div>
      </div>

      <button type="button" id="clear-filters" class="toolbar-clear-btn">✕ Clear</button>

    </div>

    <table id="habit-table">
      <thead>
        <tr>
          <th>Habit</th>
          <th>Category</th>
          <th>Frequency</th>
          <th id="sort-checkins-header" class="sortable">Check-ins</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="habit-list-body"></tbody>
    </table>
    </div>

  </main>

  <script src="js/habits.js"></script>
  <script src="js/render.js"></script>
  <script src="js/filter.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
